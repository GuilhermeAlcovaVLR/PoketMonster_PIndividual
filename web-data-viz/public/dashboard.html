<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jornada Pokémon - Dashboard</title>
    <link rel="stylesheet" href="./css/dash.css" />

    <!--
    <script>
        if (sessionStorage.getItem("usuario_autenticado") != "true") {
            window.location.replace("login.html");
        }
    </script>
    -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="carregarDashboard()">
    <header class="cabecaLhoDash">
        <a href="../index.html">
            <div class="molduraLogo">
                <img src="./assets/imgs/perfilAmarelo.png" width="100%" height="100%"  alt="Logo" />
            </div>
        </a>
        <div class="cabecalhoButtonBar">
            <a href="index.html" class="ButtonSelecionado cabecalhoButton verdeclaro">
                <img src="./assets/imgs/iniciais/ABiconpokeball.png" width="100%" height="100%" alt="Home" />
            </a>
            <a href="quizMes.html" class="cabecalhoButton branco">
                <img src="./assets/gifPokeballPixel.gif" width="100%" height="100%" alt="Quiz" />
            </a>
        </div>
        <a href="login.html">
            <img class="perfilImg" src="./assets/Perfil.png" alt="Perfil" style="color: red;" />
        </a>
    </header>

    <main class="mainDash">
        <div class="topoDash">
            <div class="tituloDash">
                <h1 id="tituloDash">Jornada Pokémon</h1>
            </div>
        </div>

        <!-- KPIs da última tentativa -->
        <section class="sectionKpis">
            <div class="kpisDiv" id="cardKpi_FilasCaixas">
                <div class="cardKpi" id="cardKpi_MediaDiaria">
                    <h3>Acertos</h3>
                    <h1 id="kpi_mediaDiariaValor">--</h1>
                </div>

                <div class="cardKpi" id="cardKpi_CaixaMaisCheio">
                    <h3>Tempo</h3>
                    <h1 id="kpi_caixaMaisCheioNome">--</h1>
                </div>

                <div class="cardKpi" id="cardKpi_TempoTotal">
                    <h3>Classe</h3>
                    <h1 id="kpi_tempoTotalValor">--</h1>
                </div>
            </div>
        </section>

        <!-- Gráficos e Hall da Fama -->
        <section id="sectionGraficoCaixa" class="sectionDash">
            <div id="cardCaixaPicoOcupacao" class="divCard">
                <h1>Acertos x Erros</h1>
                <div id="supCaixaPicoOcupacao" class="supDivSelect"></div>
                <div class="chartContainer">
                    <canvas id="graficoLinhaCaixaPicoOcupacao" class="canvasGrafico"
                        aria-label="Gráfico de rosca de acertos e erros"></canvas>
                </div>
            </div>

            <div id="AcertosRegiao" class="divCard">
                <h1>Acertos por região</h1>
                <div class="supDivSelect"></div>
                <div class="chartContainer">
                    <canvas id="canvasAcertosRegiao" class="canvasGrafico"
                        aria-label="Gráfico radar de acertos por região"></canvas>
                </div>
            </div>

            <div id="cardHallDaFama" class="divCard">
                <h1>HALL DA FAMA</h1>
                <div class="supDivSelect"></div>
                <div class="chartContainer" style="overflow-y: auto; width: 100%;">
                    <table style="width: 100%; border-collapse: collapse; text-align: center;">
                        <thead>
                            <tr style="border-bottom: 1px solid #ccc;">
                                <th style="padding: 8px;">#</th>
                                <th style="padding: 8px;">Treinador</th>
                                <th style="padding: 8px;">Tempo</th>
                                <th style="padding: 8px;">Data</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaHallDaFama">
                            <tr>
                                <td colspan="4" style="padding: 12px;">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        function carregarDashboard() {
            const idUsuario = sessionStorage.ID_USUARIO;

            if (idUsuario) {
                carregarKpis(idUsuario);
                carregarDonut(idUsuario);
                carregarRadar(idUsuario);
            } else {
                console.warn('ID_USUARIO não encontrado no sessionStorage.');
            }

            carregarHallDaFama();
        }

        // 1. Preenche as 3 KPIs da última tentativa do usuário
        function carregarKpis(usuarioId) {
            fetch(`/resultados/kpis/${usuarioId}`)
                .then(function (resposta) {
                    if (!resposta.ok) throw new Error('Erro ao buscar KPIs');
                    return resposta.json();
                })
                .then(function (dados) {
                    document.getElementById('kpi_mediaDiariaValor').innerHTML = `${dados.acertos} / 30`;
                    document.getElementById('kpi_caixaMaisCheioNome').innerHTML = `${dados.tempo_segundos}s`;
                    document.getElementById('kpi_tempoTotalValor').innerHTML = dados.classe;
                })
                .catch(function (erro) {
                    console.error('Erro nas KPIs:', erro);
                });
        }

        // 2. Gráfico Donut: Acertos x Erros gerais
        function carregarDonut(usuarioId) {
            fetch(`/resultados/percentual/${usuarioId}`)
                .then(function (resposta) {
                    if (!resposta.ok) throw new Error('Erro ao buscar percentual');
                    return resposta.json();
                })
                .then(function (dados) {
                    const ctx = document.getElementById('graficoLinhaCaixaPicoOcupacao');

                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Acertos', 'Erros'],
                            datasets: [{
                                label: 'Questões',
                                data: [dados.total_acertos, dados.total_erradas],
                                backgroundColor: ['#4CAF50', '#E53935'],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false
                        }
                    });
                })
                .catch(function (erro) {
                    console.error('Erro no gráfico Donut:', erro);
                });
        }

        // 3. Gráfico Radar: Acertos por região
        function carregarRadar(usuarioId) {
            fetch(`/resultados/por-regiao/${usuarioId}`)
                .then(function (resposta) {
                    if (!resposta.ok) throw new Error('Erro ao buscar acertos por região');
                    return resposta.json();
                })
                .then(function (dados) {
                    const ctx2 = document.getElementById('canvasAcertosRegiao');

                    new Chart(ctx2, {
                        type: 'radar',
                        data: {
                            labels: ['Kanto', 'Johto', 'Hoenn', 'Sinnoh', 'Unova', 'Kalos'],
                            datasets: [{
                                label: 'Acertos por Região',
                                data: [
                                    dados.Kanto,
                                    dados.Johto,
                                    dados.Hoenn,
                                    dados.Sinnoh,
                                    dados.Unova,
                                    dados.Kalos
                                ],
                                backgroundColor: 'rgba(54, 162, 235, 0.25)',
                                borderColor: 'rgb(54, 162, 235)',
                                pointBackgroundColor: '#FFD700',
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                r: {
                                    beginAtZero: true,
                                    // ADICIONADO: trava o teto da escala em 5 (máximo de questões por região)
                                max: 5,
                                // ADICIONADO: configura as marcações numéricas do eixo radial
                                ticks: {
                                    // ADICIONADO: exibe apenas números inteiros (0, 1, 2, 3, 4, 5) sem decimais
                                    stepSize: 1,
                                    showLabelBackdrop: false,
                                    color: '#FFFFFF'
                                // ADICIONADO: fecha o objeto ticks
                                },
                                
                                pointLabels: {
                                color: '#FFFFFF'
                            },
                            grid: {
                color: 'rgba(255, 255, 255, 0.35)', // Branco com 35% de opacidade (aumente até 1.0 se quiser mais forte)
                lineWidth: 1.5 // Espessura da linha em pixels
            },
            angleLines: {
                color: 'rgba(255, 255, 255, 0.35)', // Mesma cor dos anéis para manter uniformidade
                lineWidth: 1.5
            }
                                }
                            }
                        }
                    });
                })
                .catch(function (erro) {
                    console.error('Erro no gráfico Radar:', erro);
                });
        }

        // 4. Tabela Hall da Fama (quem gabaritou 30/30)
        function carregarHallDaFama() {
            fetch('/resultados/hall')
                .then(function (resposta) {
                    if (!resposta.ok) throw new Error('Erro ao buscar Hall da Fama');
                    return resposta.json();
                })
                .then(function (lista) {
                    const tbody = document.getElementById('tabelaHallDaFama');
                    tbody.innerHTML = '';

                    if (lista.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="4" style="padding: 12px;">Nenhum Mestre Pokémon ainda!</td>
                            </tr>
                        `;
                        return;
                    }

                    lista.forEach(function (registro, index) {
                        const dataFormatada = new Date(registro.DATA).toLocaleDateString('pt-BR');
                        tbody.innerHTML += `
                            <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                                <td style="padding: 8px;">${index + 1}º</td>
                                <td style="padding: 8px;">${registro.TREINADOR}</td>
                                <td style="padding: 8px;">${registro.TEMPO}s</td>
                                <td style="padding: 8px;">${dataFormatada}</td>
                            </tr>
                        `;
                    });
                })
                .catch(function (erro) {
                    console.error('Erro no Hall da Fama:', erro);
                });
        }
    </script>
</body>

</html>
