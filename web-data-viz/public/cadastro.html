<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AquaTech | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <h1 class="titulo">AquaTech</h1>
      <ul class="navbar">
        <li>
          <a href="index.html">Inicial</a>
        </li>
        <li>
          <a href="simulador.html">Simulador</a>
        </li>
        <li>|</li>
        <li>
          <a href="login.html">Login</a>
        </li>
        <li class="agora">
          <a href="#">Cadastro</a>
        </li>
      </ul>
    </div>
  </div>
  <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->

          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
            <small class="mensagem-campo"></small>
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="squirtle@esquadrao.com" />
            <small class="mensagem-campo"></small>
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
            <small class="mensagem-campo"></small>
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
            <small class="mensagem-campo"></small>
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/gifPoket.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>


</body>

</html>

<script>
  function erroInput(input, mensagem) {
    const campoItem = input.parentElement;
    const textoMensagem = campoItem.querySelector(".mensagem-campo");

    textoMensagem.innerText = mensagem;
    campoItem.className = "campo error";
  }

  function limparErrorInput(input) {
    const campoItem = input.parentElement;
    campoItem.className = "campo";
  }

  function checharNome() {
    const nomeVar = nome_input.value.trim();

    if (nomeVar === "") {
      erroInput(nome_input, "Insira seu nome treinador")
    } else {
      limparErroInput(nome_input);
    }
  }

  function checharEmail() {
    const emailVar = email_input.value.trim();

    if (emailVar === "") {
      erroInput(email_input, "Insira seu email")
    } else if (!emailVar.includes("@") || !emailVar.includes(".")) {
      erroInput(email_input, `O email deve conter @ e "." (ex: red@gmail.com)`)
    } else {
      limparErroInput(email_input);
    }
  }


  function checarSenha(){
    const senhaVar = senha_input.value.trim();

    if(senhaVar === ""){
      erroInput(senha_input, "Insira uma senha")
    }else if(senhaVar.length > 8){
      erroInput(senha_input, "A senha deve ter pelo menos 8 caracteres")
    }else{
      limparErrorInput(senha_input);
    }
  }

    function checarConfirmacaoSenha(){
    const ConfirmacaosenhaVar = confirmacao_senha_input.value.trim();

    if(senhaVar === ""){
      erroInput(confirmacao_senha_input, "Confirme sua senha")
    }else if(ConfirmacaosenhaVar != senhaVar){
      erroInput(confirmacao_senha_input, "A senha deve ter pelo menos 8 caracteres")
    }else{
      limparErrorInput(confirmacao_senha_input);
    }
  }



  function cadastrar() {
    checarNome(); // Valida o Nome
    checarEmail(); // Valida o E-mail
    checarSenha(); // Valida a Senha
    checarConfirmacaoSenha(); // Valida a Confirmação de Senha

    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Preencha todos os campos em branco!";
      finalizarAguardar();
      return false;
    } else if (senhaVar != confirmacaoSenhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não coincidem!";
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";
          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, 2000);

          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
