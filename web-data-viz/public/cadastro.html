<body>
  <!--header inicio-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->

          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
            <small class="mensagem-campo"></small>
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="squirtle@esquadrao.com" />
            <small class="mensagem-campo"></small>
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
            <small class="mensagem-campo"></small>
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
            <small class="mensagem-campo"></small>
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/gifPoket.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

<script>
  function erroInput(input, mensagem) {
    const campoItem = input.parentElement;
    const textoMensagem = campoItem.querySelector(".mensagem-campo");

    textoMensagem.innerText = mensagem;
    campoItem.className = "campo error";
  }

  function limparErrorInput(input) {
    const campoItem = input.parentElement;
    campoItem.className = "campo";
  }

  function checarNome() {
    const nomeVar = nome_input.value.trim();

    if (nomeVar === "") {
      erroInput(nome_input, "Oak : Agora, qual era mesmo o seu nome?")
    } else {
      limparErrorInput(nome_input);
    }
  }

  function checarEmail() {
    const emailVar = email_input.value.trim();

    if (emailVar === "") {
      erroInput(email_input, "Insira seu email")
    } else if (!emailVar.includes("@") || !emailVar.includes(".")) {
      erroInput(email_input, `O email deve conter @ e "." (ex: red@gmail.com)`)
    } else {
      limparErrorInput(email_input);
    }
  }


  function checarSenha(){
    const senhaVar = senha_input.value.trim();

    if(senhaVar === ""){
      erroInput(senha_input, "Insira uma senha")
    }else if(senhaVar.length < 8){
      erroInput(senha_input, "A senha deve ter pelo menos 8 caracteres")
    }else{
      limparErrorInput(senha_input);
    }
  }

    function checarConfirmacaoSenha(){
    const senhaVar = senha_input.value.trim();
    const ConfirmacaosenhaVar = confirmacao_senha_input.value.trim();

    if(ConfirmacaosenhaVar === ""){
      erroInput(confirmacao_senha_input, "Confirme sua senha")
    }else if(ConfirmacaosenhaVar != senhaVar){
      erroInput(confirmacao_senha_input, "As senhas não podem ser diferentes")
    }else{
      limparErrorInput(confirmacao_senha_input);
    }
  }

  nome_input.addEventListener("blur", checarNome);
  email_input.addEventListener("blur", checarEmail);
  senha_input.addEventListener("blur", checarSenha);
  confirmacao_senha_input.addEventListener("blur", checarConfirmacaoSenha)




  function cadastrar() {
    checarNome(); 
    checarEmail(); 
    checarSenha(); 
    checarConfirmacaoSenha(); 

    const campos = document.querySelectorAll(".formulario .campo");
    const formularioValido = [...campos].every((item) => item.className === "campo" );
    if(!formularioValido){
      return false
    }
    
    
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nome_input.value.trim(),
        emailServer: email_input.value.trim(),
        senhaServer: senha_input.value.trim(),
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";
          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, 2000);
        } else {
          resposta.text().then((texto) => { 
            if (texto.includes("Duplicate entry")) { 
              erroInput(email_input, "Este e-mail já está cadastrado."); 
            } else { 
              cardErro.style.display = "block";
              mensagem_erro.innerHTML = "Erro ao realizar o cadastro."; 
            }
          });
        }
      })
      .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
