<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo - Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>


<body onload="onloadEsconder()">
    <div id="pontuacaoEJogo">
        <div class="tela-inicial" id="telaInicial">
            <button id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>
        </div>

        <div class="container-quiz" id="containerQuiz">
            
            <section class="coluna-esquerda">
                <div id="pontuacao">
                    <div id="pontuacaoDuranteJogo" class="placar">
                        <span>♦ Acertos: <strong id="spanCertas">0</strong></span><br>
                        <span >♦ Erros: <span id="spanErradas">0</span></span>
                    </div>
                    <div id="pontuacaoFinalJogo" style="display: none;">
                        <h2 id="pontuacaoFinal">Pontuação Final: <span id="spanPontuacaoFinal">***</span></h2>
                        <p id="msgFinal">***</p>
                    </div>
                </div>

                <div id="jogo" class="alinhamento">
                    <div id="infoQuestao" class="subtitulo-regiao">
                        <span>♦ Questão <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span> • Região: <strong id="spanRegiaoAtual">Kanto</strong></span>
                    </div>

                    <div id="perguntaDaQuestaoAtual">
                        <h1 id="spanQuestaoExibida" class="titulo-pergunta">QUEM É ESSE POKÉMON?</h1>
                        <span id="spanRevelacao" class="texto-revelacao"></span>
                        
                        <div class="box-pokemon">
                            <img id="imgPokemon" class="silhueta" alt="Pokémon oculto">
                        </div>
                    </div>
                </div>
            </section>

            <section class="coluna-direita">
                <div id="infoAlternativas" class="instrucao-opcoes">
                    <span><em>Escolha uma opção dentre as abaixo:</em></span>
                </div>

                <div id="opcoes" class="opcoes">
                    <button class="btn-opcao" value="alternativaA" onclick="selecionarResposta(this)"></button>
                    <button class="btn-opcao" value="alternativaB" onclick="selecionarResposta(this)"></button>
                    <button class="btn-opcao" value="alternativaC" onclick="selecionarResposta(this)"></button>
                    <button class="btn-opcao" value="alternativaD" onclick="selecionarResposta(this)"></button>
                </div>

                <div id="botoes" class="controles-quiz">
                    <button onclick="avancar()" id="btnProx" class="btn-acao" disabled>Avançar para próxima questão</button>
                    <button onclick="tentarNovamente()" id="btnTentarNovamente" class="btn-acao" disabled>Tentar novamente</button>
                </div>
            </section>

        </div>
    </div>
</body>

</html>
<script>
    const listaDeQuestoes = [

        {
            geracao: 1,
            regiao: "Kanto",
            pergunta: "QUEM É ESSE POKÉMON?",
            revelacao: "É O PIKACHU",
            imagem: "./assets/imgs/Pikachu.png",
            alternativaA: "Gengar",
            alternativaB: "Nidorino",
            alternativaC: "Pikachu",
            alternativaD: "Eeve",
            alternativaCorreta: "alternativaC"
        },

        {
            pergunta: "Quantas horas tem em um dia?",
            alternativaA: "30 horas",
            alternativaB: "38 horas",
            alternativaC: "48 horas",
            alternativaD: "24 horas",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Qual destes números é ímpar?",
            alternativaA: "Dez",
            alternativaB: "Doze",
            alternativaC: "Oito",
            alternativaD: "Onze",
            alternativaCorreta: "alternativaD"
        }

    ]

    // variáveis globais    
    let numeroDaQuestaoAtual = 0
    let pontuacaoFinal = 0
    let tentativaIncorreta = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length
    // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false

    function onloadEsconder() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('jogo').style.display = "none"
    }

    function iniciarQuiz() {
        document.getElementById('pontuacao').style.display = "flex"
        document.getElementById('jogo').style.display = "grid"
        document.getElementById('btnIniciarQuiz').style.display = "none"
        document.getElementById('telaInicial').style.display = "none";
    document.getElementById('containerQuiz').style.display = "grid";

        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

        preencherHTMLcomQuestaoAtual(0)

        btnProx.disabled = true
        // btnConcluir.disabled = true
        btnTentarNovamente.disabled = true
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index
        console.log("questaoAtual")
        console.log(questaoAtual)

        document.getElementById("spanRegiaoAtual").innerHTML = questaoAtual.regiao;
        const img = document.getElementById("imgPokemon");
        img.src = questaoAtual.imagem;
        img.classList.remove("revelado");
        document.getElementById("spanRevelacao").innerHTML = "";

        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;

        const botoes = document.querySelectorAll(".btn-opcao");
        botoes[0].innerHTML = questaoAtual.alternativaA;
        botoes[1].innerHTML = questaoAtual.alternativaB;
        botoes[2].innerHTML = questaoAtual.alternativaC;
        botoes[3].innerHTML = questaoAtual.alternativaD;
    }

    function selecionarResposta(botaoClicado) {
        habilitarAlternativas(false); // [ALTERADO] Trava os botões logo no clique
        btnProx.disabled = false;

        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual];

        // [ALTERADO] Revela o Pokémon e o texto imediatamente (sem precisar procurar a opção correta antes)
        document.getElementById("spanRevelacao").innerHTML = questaoAtual.revelacao || "";
        document.getElementById("imgPokemon").classList.add("revelado");

        // [ALTERADO] Compara direto o value do botão clicado, sem loop e sem adicionar classes de cor verde/vermelha
        if (botaoClicado.value === questaoAtual.alternativaCorreta) {
            pontuacaoFinal++;
            certas++;
            document.getElementById("spanCertas").innerHTML = certas;
        } else {
            tentativaIncorreta++;
            erradas++;
            document.getElementById("spanErradas").innerHTML = erradas;
        }

        numeroDaQuestaoAtual++;
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        const botoes = document.querySelectorAll(".btn-opcao");
        botoes.forEach((btn) => {
            btn.disabled = opcaoEscolhida;
        });

    }

    function avancar() {
        btnProx.disabled = true


        if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else if (numeroDaQuestaoAtual == quantidadeDeQuestoes - 1) {
            alert("Atenção... a próxima é a ultima questão!")
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else {
            finalizarJogo()
        }
    }

    function tentarNovamente() {
        // atualiza a página
        window.location.reload()
    }




    function finalizarJogo() {
        let textoParaMensagemFinal = null
        let classComCoresParaMensagemFinal = null
        const porcentagemFinalDeAcertos = pontuacaoFinal / quantidadeDeQuestoes

        if (porcentagemFinalDeAcertos <= 0.3) {
            textoParaMensagemFinal = "Parece que você não estudou..."
            classComCoresParaMensagemFinal = "text-danger-with-bg"
        }
        else if (porcentagemFinalDeAcertos > 0.3 && porcentagemFinalDeAcertos < 0.9) {
            textoParaMensagemFinal = "Pode melhorar na próxima, hein!"
            classComCoresParaMensagemFinal = "text-warning-with-bg"
        }
        else if (porcentagemFinalDeAcertos >= 0.9) {
            textoParaMensagemFinal = "Uau, parabéns!"
            classComCoresParaMensagemFinal = "text-success-with-bg"
        }

        textoParaMensagemFinal += "<br> Você acertou " + Math.round((porcentagemFinalDeAcertos) * 100) + "% das questões."


        document.getElementById('msgFinal').innerHTML = textoParaMensagemFinal
        document.getElementById('msgFinal').classList.add(classComCoresParaMensagemFinal)
        document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal

        document.getElementById('jogo').classList.add("text-new-gray")

        btnProx.disabled = true
        // btnConcluir.disabled = true
        btnTentarNovamente.disabled = false

    }
</script>
